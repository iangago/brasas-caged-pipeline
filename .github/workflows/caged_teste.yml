# Pipeline do CAGED - Etapa 1 (teste)
# Roda so quando voce clica em "Run workflow" na aba Actions.
# Salvar no repositorio em: .github/workflows/caged_teste.yml

name: CAGED - teste etapa 1

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install pandas py7zr

      - name: Rodar o teste do CAGED
        run: python caged_etapa1_teste.py
